<style>
:root{--bg:#0f1115;--panel:#181b22;--panel2:#1f232c;--border:#2a2f3a;--text:#e7ebf0;--muted:#9aa4b2;--accent:#4f8cff;--good:#2ecc71;--bad:#ff5c5c;--warn:#f5a623}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.app{display:flex;min-height:100vh}
.side{width:210px;background:var(--panel);border-right:1px solid var(--border);padding:18px 12px;position:sticky;top:0;height:100vh}
.side h1{font-size:15px;margin:0 0 2px}.side .tag{color:var(--muted);font-size:11px;margin-bottom:22px}
.nav a{display:block;padding:9px 12px;border-radius:8px;color:var(--text);margin-bottom:4px;font-size:14px;cursor:pointer}
.nav a.active{background:var(--panel2);color:var(--accent)}.nav a:hover{background:var(--panel2)}
.main{flex:1;padding:22px 26px;max-width:1100px}h2{margin:0 0 14px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 16px;min-width:120px}
.stat .n{font-size:22px;font-weight:600}.stat .l{color:var(--muted);font-size:11px;margin-top:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer}
.card:hover{border-color:var(--accent)}.card .nm{font-size:12px;color:var(--muted)}
.card .v{font-size:24px;font-weight:600;margin:3px 0}.card .v small{font-size:12px;color:var(--muted);font-weight:400}
.card .meta{font-size:11px;color:var(--muted);margin-top:6px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10px;font-weight:600}
.pill.good{background:rgba(46,204,113,.15);color:var(--good)}.pill.bad{background:rgba(255,92,92,.15);color:var(--bad)}.pill.warn{background:rgba(245,166,35,.15);color:var(--warn)}.pill.neutral{background:var(--panel2);color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
select{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:8px;font-size:14px}
.muted{color:var(--muted)}.spark{width:100%;height:34px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--border)}th{color:var(--muted);font-weight:500}
.rep-title{font-weight:600}.rep-meta{font-size:11px;color:var(--muted);margin-top:3px}
.rep-body{white-space:pre-wrap;font-size:13px;line-height:1.5;margin-top:10px;display:none}.rep-body.open{display:block}
.btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px}
#tip{position:fixed;pointer-events:none;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:12px;display:none;z-index:9}
@media(max-width:680px){.app{flex-direction:column}.side{width:auto;height:auto;position:static}.main{padding:16px}}
